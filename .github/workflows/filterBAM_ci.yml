name: filterBAM_ci

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  tests:
    name: Tests (Ubuntu, Python 3.12)
    runs-on: ubuntu-latest
    if: ${{ !(github.event_name == 'push' && contains(github.event.head_commit.message || '', '[skip_ci]')) && !(github.event_name == 'pull_request' && contains(github.event.pull_request.title || '', '[skip_ci]')) }}
    defaults:
      run:
        shell: bash -l {0}
    steps:
      - uses: actions/checkout@v4

      - name: Set up micromamba
        uses: mamba-org/setup-micromamba@v1
        with:
          environment-file: environment.yml
          cache-environment: true
          init-shell: bash
          condarc: |
            channel_priority: strict

      - name: Install project (editable)
        run: |
          pip install --upgrade pip
          pip install -e .[test,dev]

      - name: Lint with flake8
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run pytest
        run: |
          pytest --maxfail=1 --disable-warnings -vv

      - name: Check filterBAM help message
        run: |
          filterBAM --help
