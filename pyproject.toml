[build-system]
requires = [
  "setuptools>=69",
  "wheel",
  "cython>=0.29.24",
  "numpy>=1.24",
  "versioneer[toml]",
]
build-backend = "setuptools.build_meta"

[project]
name = "bam-filter"
dynamic = ["version"]
description = "A simple tool to filter references from a BAM file using different filter types"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }
authors = [
  { name = "Antonio Fernandez-Guerra", email = "antonio@metagenomics.eu" },
]
keywords = ["bam-filter"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "Cython>=0.29.24",
  "tqdm>=4.64.1",
  "psutil>=5.9.8",
  "pyarrow>=10.0.0",
]

[project.urls]
Homepage = "https://github.com/genomewalker/bam-filter"
Repository = "https://github.com/genomewalker/bam-filter"
Issues = "https://github.com/genomewalker/bam-filter/issues"

[project.scripts]
filterBAM = "bam_filter.__main__:main"

[project.optional-dependencies]
test = [
  "pytest",
  "pytest-cov",
  "pytest-dependency",
  "pytest-console-scripts",
  "ray>=0.8.7",
]
dev = ["flake8"]

[tool.setuptools.packages.find]
include = ["bam_filter"]
exclude = ["docs", "tests", "scripts"]

[tool.setuptools.dynamic]
version = { attr = "bam_filter.__version__" }

[tool.versioneer]
VCS = "git"
style = "pep440"
versionfile_source = "bam_filter/_version.py"
versionfile_build = "bam_filter/_version.py"
tag_prefix = ""
parentdir_prefix = "bam-filter-"
